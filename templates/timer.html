{% extends "base.html" %}

{% block title %}StudyHub | 学習中{% endblock %}

{% block page_name %}学習中{% endblock %}

{% block content %}

<section>
    <h2>学習中</h2>

    <p>科目：{{ subject }}</p>
    <p>分野：{{ topic }}</p>
    <p>学習内容：{{ content }}</p>

    <div class="timer" id="timer">
        {{ minutes }}:00
    </div>

    <div class="timer-buttons">
        <button id="pause-button">一時停止</button>
        <button id="finish-button">学習終了</button>
    </div>
</section>

{% endblock %}


{% block scripts %}

<script>
    const targetMinutes = Number("{{ minutes }}");
    let remainingSeconds = targetMinutes * 60;
    let elapsedSeconds = 0;

    const timerElement = document.getElementById("timer");
    const pauseButton = document.getElementById("pause-button");
    const finishButton = document.getElementById("finish-button");

    // 一時停止中かどうか
    let isPaused = false;

    function updateTimer() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;

        timerElement.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");
    }

    function countdown() {
        if (!isPaused && remainingSeconds > 0) {
            remainingSeconds--;
            elapsedSeconds++;

            updateTimer();
        }
    }

    pauseButton.addEventListener("click", function () {
        // true と false を切り替える
        isPaused = !isPaused;

        if (isPaused) {
            pauseButton.textContent = "再開";
        } else {
            pauseButton.textContent = "一時停止";
        }
    });

    // 学習終了ボタン
    finishButton.addEventListener("click", function () {
        const params = new URLSearchParams({
            subject: "{{ subject }}",
            topic: "{{ topic }}",
            content: "{{ content }}",
            elapsed: elapsedSeconds
        });

        window.location.href = "/record?" + params.toString();
    });

    updateTimer();

    setInterval(countdown, 1000);
</script>

{% endblock %}
